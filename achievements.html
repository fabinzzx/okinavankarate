<!DOCTYPE HTML>
<html>
<head>
  <title>Achievements | Okinavan Shito Ryu Karate Do India</title>
  <link rel="icon" href="images/LOGO.png" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body, input, button, h1, h2, h3, h4, h5, h6, p {
      font-family: 'Poppins', sans-serif;
    }
    body { background:#f0f2f5; margin:0; }

    #achievements-section .inner {
      text-align:center;
      padding-bottom:2em;
    }

    .search-bar {
      display:inline-flex;
      flex-wrap:wrap;
      gap:.5em;
      justify-content:center;
      margin-bottom:2em;
    }

    .search-bar input,
    .search-bar select {
      padding:.6em 1em;
      font-size:1rem;
      border:1px solid #ccc;
      border-radius:4px;
      min-width:220px;
    }

    .search-bar button {
      background:#000;
      color:#fff;
      border:none;
      border-radius:4px;
      font-size:1rem;
      cursor:pointer;
    }

    #achievementsGrid {
      display:grid;
      gap:1.5em;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    }

    .achievement-card {
      background:#fff;
      border-radius:6px;
      overflow:hidden;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
      transition:.2s;
    }

    .achievement-card:hover {
      transform:translateY(-4px);
    }

    .achievement-card img {
      width:100%;
      max-height:150px;
      object-fit:contain;
      background:#f4f4f4;
      padding-top:1rem;
    }

    .achievement-info {
      padding:1em;
      text-align:center;
      font-size:.9rem;
    }

    footer {
      padding:2em 0;
      background:#111;
      color:#ccc;
    }
  </style>
</head>

<body class="loading">

<!-- Header -->
<header id="header">
  <div class="logo"></div>
  <a href="#menu">Menu</a>
</header>

<nav id="menu">
  <ul class="links">
    <li><a href="index.html">Home</a></li>
    <li><a href="aboutus.html">About Us</a></li>
    <li><a href="joinus.html">Join With Us</a></li>
    <li><a href="blackbelt.html">Blackbelt Students</a></li>
    <li><a href="achievements.html">Achievements</a></li>
    <li><a href="downloads.html">Downloads</a></li>
  </ul>
</nav>

<section id="achievements-section" class="wrapper style3">
  <div class="inner">
    <h2>Our Achievements</h2>

    <div class="search-bar">
      <input type="text" id="searchTournament" placeholder="Search by Tournament…">
      <select id="filterPosition">
        <option value="">All Positions</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>

    <div id="achievementsGrid"></div>
  </div>
</section>

<footer id="footer">
  <p style="text-align:center;">© Okinavan Shito Ryu Karate Do India</p>
</footer>

<!-- Scripts -->
<script>
  const projectId = '6o6o2622';
  const dataset = 'production';

  const groq = encodeURIComponent(`
    *[_type=="achievement"]{
      studentName,
      tournamentName,
      event,
      position,
      "imageUrl": image.asset->url
    }
  `);

  const url = `https://${projectId}.api.sanity.io/v2023-01-01/data/query/${dataset}?query=${groq}`;
  let achievements = [];

  // 🔹 Extract year from tournament name
  function extractYear(text) {
    const match = text?.match(/\b(20\d{2})\b/);
    return match ? parseInt(match[1], 10) : 0;
  }

  fetch(url)
    .then(res => res.json())
    .then(({ result }) => {
      achievements = (result || []).sort(
        (a, b) => extractYear(b.tournamentName) - extractYear(a.tournamentName)
      );
      renderAchievements(achievements);
    });

  function renderAchievements(data) {
    const grouped = {};

    data.forEach(a => {
      const key = `${a.studentName}-${a.tournamentName}`;
      if (!grouped[key]) {
        grouped[key] = {
          studentName: a.studentName,
          tournamentName: a.tournamentName,
          imageUrl: a.imageUrl,
          events: []
        };
      }
      grouped[key].events.push({ event: a.event, position: a.position });
    });

    const grid = document.getElementById('achievementsGrid');
    const groupedArray = Object.values(grouped);

    if (!groupedArray.length) {
      grid.innerHTML = '<p style="text-align:center;">No achievements found.</p>';
      return;
    }

    grid.innerHTML = groupedArray.map(a => `
      <div class="achievement-card">
        <img src="${a.imageUrl || ''}">
        <div class="achievement-info">
          <h3>${a.studentName}</h3>
          <p><strong>${a.tournamentName}</strong></p>
          ${a.events.map(e =>
            `<p>${e.event} — Position: ${e.position}</p>`
          ).join('')}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('searchBtn').addEventListener('click', () => {
    const search = document.getElementById('searchTournament').value.toLowerCase();
    const pos = document.getElementById('filterPosition').value;

    const filtered = achievements
      .filter(a =>
        (!search || a.tournamentName.toLowerCase().includes(search)) &&
        (!pos || String(a.position) === pos)
      )
      .sort((a, b) =>
        extractYear(b.tournamentName) - extractYear(a.tournamentName)
      );

    renderAchievements(filtered);
  });
</script>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/skel.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
